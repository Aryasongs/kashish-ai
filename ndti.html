    function badgeHTML(status) {
      const s = status.toLowerCase();
      let cls = 'bg-slate-100 text-slate-700 border-slate-200';
      let dot = 'bg-slate-400';
      if (['connected', 'active', 'verified', 'completed', 'indexed', 'success', 'production', 'multi-region'].includes(s)) {
        cls = 'bg-emerald-50 text-emerald-700 border-emerald-200';
        dot = 'bg-emerald-500';
      } else if (['syncing', 'hybrid'].includes(s)) {
        cls = 'bg-blue-50 text-blue-700 border-blue-200';
        dot = 'bg-blue-600 animate-pulse';
      } else if (['degraded', 'warning'].includes(s)) {
        cls = 'bg-amber-50 text-amber-800 border-amber-200';
        dot = 'bg-amber-500';
      } else if (['blocked', 'disconnected'].includes(s)) {
        cls = 'bg-rose-50 text-rose-700 border-rose-200';
        dot = 'bg-rose-500';
      }
      return `<span class="inline-flex items-center gap-1.5 text-xs font-medium px-2.5 py-0.5 rounded-full border ${cls}">
        <span class="w-1.5 h-1.5 rounded-full ${dot}"></span>${status}
      </span>`;
    }

              <button onclick="createManualSnapshot()" class="inline-flex items-center gap-2 px-4 py-2 text-xs font-medium text-white bg-blue-600 rounded-md hover:bg-blue-700">
                <i data-lucide="hard-drive-download" class="w-4 h-4"></i><span>Create Snapshot</span>
              </button>
            </div>
            <div class="bg-white border border-slate-200 rounded-lg overflow-hidden">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="border-b border-slate-200 bg-slate-50 text-[11px] font-semibold uppercase tracking-wider text-slate-500">
                    <th class="py-3 px-4">Snapshot ID</th>
                    <th class="py-3 px-4">Company / Project</th>
                    <th class="py-3 px-4">Backup Type</th>
                    <th class="py-3 px-4">Size & Records</th>
                    <th class="py-3 px-4">Created</th>
                    <th class="py-3 px-4">Status</th>
                    <th class="py-3 px-4 text-right">Action</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-200 text-xs">
                  ${BACKUPS.map(b => `
                    <tr class="hover:bg-slate-50">
                      <td class="py-3.5 px-4 font-mono font-medium text-slate-900">${b.snapId}</td>
                      <td class="py-3.5 px-4"><div class="font-medium text-slate-900">${b.company}</div><div class="font-mono text-[11px] text-slate-500">${b.project}</div></td>
                      <td class="py-3.5 px-4 text-slate-600">${b.type}</td>
                      <td class="py-3.5 px-4"><div class="font-medium text-slate-800">${b.size}</div><div class="font-mono text-[11px] text-slate-500">${b.docs} docs</div></td>
                      <td class="py-3.5 px-4 text-slate-600">${b.created}</td>
                      <td class="py-3.5 px-4">${badgeHTML(b.status)}</td>
                      <td class="py-3.5 px-4 text-right">
                        <button onclick="showToast('Initiated point-in-time restore from ${b.snapId}')" class="inline-flex items-center gap-1 px-3 py-1 text-xs font-medium text-blue-700 bg-blue-50 border border-blue-200 rounded hover:bg-blue-100">
                          <i data-lucide="rotate-ccw" class="w-3 h-3"></i><span>Restore</span>
                        </button>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      } else if (activeTab === 'explorer') {
        const docs = EXPLORER_DOCS.filter(d => explorerCollectionFilter === 'ALL' || d.collection === explorerCollectionFilter);
        container.innerHTML = `
          <div class="space-y-6">
            <div class="pb-4 border-b border-slate-200">
              <h1 class="text-xl font-semibold text-slate-900">Data Explorer</h1>
              <p class="text-sm text-slate-500 mt-0.5">Browse and inspect indexed Firestore collections across connected organizations.</p>
            </div>
            <div class="bg-white border border-slate-200 rounded-lg overflow-hidden">
              <div class="p-4 border-b border-slate-200 flex flex-wrap items-center justify-between gap-3">
                <div class="flex items-center gap-2">
                  <span class="text-xs font-semibold text-slate-600">Collection:</span>
                  <select onchange="explorerCollectionFilter = this.value; renderMainContent(); lucide.createIcons();" class="text-xs font-mono border border-slate-300 rounded px-2.5 py-1.5 bg-white">
                    <option value="ALL" ${explorerCollectionFilter === 'ALL' ? 'selected' : ''}>All Collections (${EXPLORER_DOCS.length})</option>
                    ${EXPLORER_DOCS.map(d => `<option value="${d.collection}" ${explorerCollectionFilter === d.collection ? 'selected' : ''}>${d.collection}</option>`).join('')}
                  </select>
                </div>
                <span class="text-xs text-slate-500">Showing 1–${docs.length} of ${docs.length} documents</span>
              </div>
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="border-b border-slate-200 bg-slate-50 text-[11px] font-semibold uppercase tracking-wider text-slate-500">
                    <th class="py-3 px-4">Document ID</th>
                    <th class="py-3 px-4">Collection</th>
                    <th class="py-3 px-4">Company / Project</th>
                    <th class="py-3 px-4">Size</th>
                    <th class="py-3 px-4">Status</th>
                    <th class="py-3 px-4 text-right">Payload</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-200 text-xs">
                  ${docs.map((d, idx) => `
                    <tr class="hover:bg-slate-50">
                      <td class="py-3.5 px-4 font-mono font-medium text-blue-700">${d.docId}</td>
                      <td class="py-3.5 px-4 font-mono text-slate-700">${d.collection}</td>
                      <td class="py-3.5 px-4"><div class="font-medium text-slate-900">${d.company}</div><div class="font-mono text-[11px] text-slate-500">${d.project}</div></td>
                      <td class="py-3.5 px-4 font-mono text-slate-600">${d.size}</td>
                      <td class="py-3.5 px-4">${badgeHTML(d.status)}</td>
                      <td class="py-3.5 px-4 text-right">
                        <button onclick="openJsonModal(${idx})" class="px-2.5 py-1 text-xs font-medium text-slate-700 bg-white border border-slate-300 rounded hover:bg-slate-50">Inspect JSON</button>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      } else {
        // Activity Logs & Governance Tabs
        container.innerHTML = `
          <div class="space-y-6">
            <div class="pb-4 border-b border-slate-200">
              <h1 class="text-xl font-semibold text-slate-900">Activity Logs & Governance</h1>
              <p class="text-sm text-slate-500 mt-0.5">Immutable cloud audit trail across Kashish AI, Nexor Technologies, and Nexor Sparks.</p>
            </div>
            <div class="bg-white border border-slate-200 rounded-lg overflow-hidden">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="border-b border-slate-200 bg-slate-50 text-[11px] font-semibold uppercase tracking-wider text-slate-500">
                    <th class="py-3 px-4">Timestamp (UTC)</th>
                    <th class="py-3 px-4">Action</th>
                    <th class="py-3 px-4">Actor</th>
                    <th class="py-3 px-4">Project</th>
                    <th class="py-3 px-4">Latency</th>
                    <th class="py-3 px-4">Status</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-200 text-xs">
                  ${ACTIVITY_LOGS.map(l => `
                    <tr class="hover:bg-slate-50">
                      <td class="py-3.5 px-4 font-mono text-[11px] text-slate-500">${l.time}</td>
                      <td class="py-3.5 px-4 font-mono font-medium text-slate-900">${l.action}</td>
                      <td class="py-3.5 px-4 text-slate-700">${l.actor}</td>
                      <td class="py-3.5 px-4 font-mono text-slate-700">${l.project}</td>
                      <td class="py-3.5 px-4 font-mono text-slate-500">${l.latency}</td>
                      <td class="py-3.5 px-4">${badgeHTML(l.status)}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }
    }

    // Modal & Interactive Actions
    function openConnectModal() {
      const m = document.getElementById('connectModal');
      m.classList.remove('hidden');
      m.classList.add('flex');
    }

    function closeConnectModal() {
      const m = document.getElementById('connectModal');
      m.classList.add('hidden');
      m.classList.remove('flex');
    }

    function handleAddProject(e) {
      e.preventDefault();
      const company = document.getElementById('newProjCompany').value;
      const name = document.getElementById('newProjName').value;
      const id = document.getElementById('newProjId').value.toLowerCase().replace(/\s+/g, '-');
      const region = document.getElementById('newProjRegion').value;
      PROJECTS.unshift({
        id, name, company, region, status: 'Connected', collections: 12, docs: '1,250,000', storage: '28.4 GB', pct: 22, lastSync: 'Just now'
      });
      closeConnectModal();
      renderMainContent();
      lucide.createIcons();
      showToast(`Connected Firebase project "${id}"`);
    }

    function createManualSnapshot() {
      const snapId = `snap-20261027-manual-${Math.floor(100 + Math.random() * 899)}`;
      BACKUPS.unshift({
        snapId, project: 'kashish-ai-prod-core', company: 'Kashish AI', type: 'Manual Snapshot', size: '268.5 GB', docs: '11,422,000', created: 'Just now (UTC)', status: 'Verified'
      });
      renderMainContent();
      lucide.createIcons();
      showToast(`Created immutable snapshot ${snapId}`);
    }

    function openJsonModal(idx) {
      const doc = EXPLORER_DOCS[idx];
      document.getElementById('jsonModalSubtitle').textContent = `${doc.collection} / ${doc.docId}`;
      document.getElementById('jsonModalContent').textContent = JSON.stringify(doc.payload, null, 2);
      const m = document.getElementById('jsonModal');
      m.classList.remove('hidden');
      m.classList.add('flex');
    }

    function closeJsonModal() {
      const m = document.getElementById('jsonModal');
      m.classList.add('hidden');
      m.classList.remove('flex');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      document.getElementById('toastText').textContent = msg;
      t.classList.remove('hidden');
      t.classList.add('flex');
      setTimeout(() => {
        t.classList.add('hidden');
        t.classList.remove('flex');
      }, 3200);
    }

    // Initialize App on Load
    window.addEventListener('DOMContentLoaded', () => {
      renderSidebar();
      renderMainContent();
      lucide.createIcons();
    });
  </script>
</body>
</html>
