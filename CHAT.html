<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Messages</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6EEFA; --card:#fff; --navy:#2D2A5E; --ink:#3A3860; --muted:#8C90A8; --soft:#F3F4FC;
  --blue:#3B82F6; --blue-d:#2F6FE0; --line:#EDEFF7; --danger:#E5484D;
  --head:'Poppins','Inter',system-ui,sans-serif; --body:'Inter',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0E1424;--card:#171D30;--navy:#ECEEFB;--ink:#D8DBF0;--muted:#8A90AD;--soft:#222a42;--line:#262E48}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);font-family:var(--body);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

.stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:56px;padding:32px}
.phone{width:min(475px,100%);height:min(990px,calc(100vh - 64px));background:var(--card);border-radius:56px;box-shadow:0 30px 70px rgba(70,100,170,.10);position:relative;overflow:hidden;display:flex;flex-direction:column}

/* ---------- left: list card ---------- */
.panel{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 32px}
.panel-top{display:flex;align-items:center;justify-content:space-between;padding-top:82px;margin-bottom:18px}
.panel-top h1{font:600 40px/1.1 var(--head);color:var(--navy);margin:0;letter-spacing:-.3px}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;color:var(--muted);border-radius:50%}
.icon-btn:hover{background:var(--soft)}
.searchbar{margin:0 0 6px;display:none}
.searchbar.on{display:block}
.searchbar input{width:100%;height:44px;border:0;border-radius:22px;background:var(--soft);padding:0 18px;outline:none}
.scroll{flex:1;min-height:0;overflow-y:auto;margin:0 -32px;padding:0 32px 90px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.row{display:flex;gap:16px;align-items:flex-start;padding:16px 0;cursor:pointer;width:100%;text-align:left}
.row .body{flex:1;min-width:0}
.row .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.row .name{font:500 18px/1.3 var(--head);color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .time{font-size:15px;color:var(--muted);white-space:nowrap}
.row .prev{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:6px}
.row .txt{color:var(--muted);font-size:16px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.badge{min-width:32px;height:32px;border-radius:10px;background:var(--blue);color:#fff;font:600 15px/32px var(--body);text-align:center;padding:0 8px;flex:none}
.row.active .name{color:var(--blue)}
.av{position:relative;flex:none;border-radius:50%;display:grid;place-items:center;color:#fff;font:600 20px var(--head)}
.av img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.av .dot{position:absolute;right:1%;bottom:1%;width:22%;max-width:20px;min-width:12px;aspect-ratio:1;border-radius:50%;background:var(--blue);border:3px solid var(--card)}
.empty{color:var(--muted);text-align:center;padding:60px 20px;line-height:1.6;font-size:15px}
.empty b{display:block;color:var(--navy);font:600 18px var(--head);margin-bottom:6px}

.fab{position:absolute;right:30px;bottom:132px;width:80px;height:80px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;box-shadow:0 14px 30px rgba(59,130,246,.45);z-index:3;transition:transform .15s}
.fab:active{transform:scale(.94)}
.fab svg{width:34px;height:34px;stroke-width:1.6}

.nav{height:112px;flex:none;display:flex;justify-content:space-around;align-items:center;padding:0 38px 6px;background:var(--card)}
.nav button{position:relative;width:48px;height:48px;display:grid;place-items:center;color:#9CA0B8}
.nav button.on{color:var(--navy)}
.nav button.on::after{content:"";position:absolute;bottom:-6px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--navy)}
.nav svg{width:30px;height:30px}

/* settings / contacts */
.sec{margin-bottom:22px}
.sec h3{font:500 13px var(--head);color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin:0 0 10px}
.me-card{display:flex;gap:16px;align-items:center;padding:6px 0 18px}
.me-card .n{font:600 22px var(--head);color:var(--navy)}
.me-card .e{color:var(--muted);font-size:14px;word-break:break-all}
.uidbox{background:var(--soft);border-radius:20px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.uidbox small{display:block;color:var(--muted);font-size:12px}
.uidbox b{font:600 24px var(--head);color:var(--navy);letter-spacing:1.5px}
.item{display:flex;align-items:center;gap:14px;padding:14px 4px;width:100%;text-align:left;color:var(--navy);font-weight:500;border-bottom:1px solid var(--line)}
.item svg{color:var(--muted)}
.item .sub{display:block;color:var(--muted);font-weight:400;font-size:13px}
.item.danger{color:var(--danger)}.item.danger svg{color:var(--danger)}
.note{background:var(--soft);border-radius:18px;padding:14px 16px;font-size:13px;color:var(--muted);line-height:1.55;display:flex;gap:10px}
.note svg{width:20px;height:20px;color:var(--blue);margin-top:1px}

/* ---------- right: chat card ---------- */
.chat-empty{flex:1;display:grid;place-items:center;text-align:center;color:var(--muted);padding:40px;line-height:1.6}
.chat-empty .lk{width:84px;height:84px;border-radius:50%;background:var(--soft);display:grid;place-items:center;margin:0 auto 18px;color:var(--blue)}
.chat-empty .lk svg{width:38px;height:38px}
.chat-empty b{display:block;color:var(--navy);font:600 20px var(--head);margin-bottom:4px}
.chead{padding:56px 32px 0;display:grid;grid-template-columns:48px 1fr 48px;align-items:start;flex:none}
.chead .mid{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.chead .mid .nm{font:500 19px var(--head);color:var(--navy);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chead .icon-btn{color:var(--navy);margin-top:18px}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:26px 32px 10px;display:flex;flex-direction:column;gap:6px;scrollbar-width:none}
.msgs::-webkit-scrollbar{display:none}
.e2e{align-self:center;background:var(--soft);color:var(--muted);font-size:12px;padding:7px 14px;border-radius:14px;display:flex;gap:6px;align-items:center;text-align:center;margin-bottom:10px;max-width:92%}
.e2e svg{width:14px;height:14px;flex:none}
.day{align-self:center;color:var(--muted);font-size:12px;margin:8px 0}
.m{display:flex;flex-direction:column;max-width:86%;margin-top:6px}
.m.me{align-self:flex-end;align-items:flex-end}
.m.them{align-self:flex-start;align-items:flex-start}
.bub{padding:16px 30px 16px 30px;font-size:17px;line-height:1.45;word-break:break-word;white-space:pre-wrap;border-radius:32px}
.m.me .bub{background:var(--blue);color:#fff;border-bottom-right-radius:0}
.m.them .bub{background:var(--soft);color:var(--ink);border-bottom-left-radius:0}
.m .ts{font-size:15px;color:var(--muted);margin-top:7px}
.m.sticker .bub{background:none!important;padding:0;font-size:96px;line-height:1.1}
.m.img .bub{padding:4px;border-radius:24px}
.m.img.me .bub{border-bottom-right-radius:0}.m.img.them .bub{border-bottom-left-radius:0}
.bub img{display:block;max-width:100%;max-height:300px;border-radius:20px;cursor:zoom-in}
.m.locked .bub{font-style:italic;opacity:.8}
.voice{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 22px;min-width:250px}
.m.voicem .bub{padding:0}
.wave{display:flex;align-items:center;gap:2px;height:44px;flex:1}
.wave i{display:block;width:3px;border-radius:2px;background:#C9CBD8;min-height:3px}
.wave i.p{background:var(--blue)}
.m.me .wave i{background:rgba(255,255,255,.45)}.m.me .wave i.p{background:#fff}
.vdur{font-size:16px;color:var(--navy);min-width:42px}
.m.me .vdur{color:#fff}
.play{width:58px;height:58px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none}
.m.me .play{background:#fff;color:var(--blue)}
.play svg{width:20px;height:20px;fill:currentColor;stroke:none}
.typing{height:30px;padding:0 32px;color:var(--muted);font-size:16px;display:flex;align-items:center;gap:6px;flex:none}
.typing .d{display:inline-flex;gap:3px}
.typing .d i{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:bl 1.2s infinite}
.typing .d i:nth-child(2){animation-delay:.2s}.typing .d i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,60%,100%{opacity:.25}30%{opacity:1}}
.composer{padding:8px 32px 38px;flex:none;position:relative}
.pill{height:76px;border-radius:38px;background:var(--soft);display:flex;align-items:center;gap:14px;padding:0 20px 0 14px}
.plus{width:50px;height:50px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none;transition:transform .2s}
.plus.open{transform:rotate(45deg)}
.plus svg{width:26px;height:26px;stroke-width:2.2}
.pill input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:18px;color:var(--navy)}
.pill input::placeholder{color:#9A9EB8}
.pill .em{color:var(--blue);width:36px;height:36px;display:grid;place-items:center}
.pill .em svg{width:32px;height:32px;stroke-width:1.5}
.sendb{width:46px;height:46px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none}
.sendb svg{width:22px;height:22px}
.menu{position:absolute;left:32px;bottom:122px;background:var(--card);border-radius:22px;box-shadow:0 14px 40px rgba(40,60,120,.18);padding:8px;z-index:5;min-width:190px}
.menu button{display:flex;gap:12px;align-items:center;width:100%;padding:12px 14px;border-radius:14px;color:var(--navy);font-weight:500}
.menu button:hover{background:var(--soft)}
.menu svg{color:var(--blue)}
.emoji{position:absolute;right:32px;bottom:122px;background:var(--card);border-radius:22px;box-shadow:0 14px 40px rgba(40,60,120,.18);padding:10px;z-index:5;width:min(330px,calc(100% - 64px));display:grid;grid-template-columns:repeat(8,1fr);gap:2px;max-height:230px;overflow:auto}
.emoji button{font-size:24px;height:38px;border-radius:10px}.emoji button:hover{background:var(--soft)}
.rec{display:flex;align-items:center;gap:14px;width:100%}
.rec .t{flex:1;color:var(--danger);font-weight:600;display:flex;gap:8px;align-items:center}
.rec .t::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--danger);animation:bl 1s infinite}
.rec .x{color:var(--muted)}

/* ---------- auth / setup ---------- */
.solo{padding:64px 40px 40px;overflow-y:auto;flex:1;display:flex;flex-direction:column;scrollbar-width:none}
.logo{width:76px;height:76px;border-radius:26px;background:var(--blue);color:#fff;display:grid;place-items:center;margin:0 0 26px;box-shadow:0 14px 30px rgba(59,130,246,.4)}
.logo svg{width:38px;height:38px;stroke-width:1.5}
.solo h1{font:600 36px/1.15 var(--head);color:var(--navy);margin:0 0 8px}
.solo p.sub{color:var(--muted);margin:0 0 26px;line-height:1.55}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px 6px}
.field input,.field textarea{width:100%;height:54px;border-radius:27px;border:2px solid transparent;background:var(--soft);padding:0 22px;outline:none;font-size:16px;color:var(--navy)}
.field textarea{height:84px;padding:14px 22px;resize:none;border-radius:26px}
.field input:focus,.field textarea:focus{border-color:var(--blue);background:var(--card)}
.btn{height:56px;border-radius:28px;background:var(--blue);color:#fff;font:500 17px var(--head);width:100%;box-shadow:0 12px 24px rgba(59,130,246,.35);margin-top:6px}
.btn:disabled{opacity:.6}
.btn.ghost{background:var(--soft);color:var(--navy);box-shadow:none}
.btn.line{background:none;box-shadow:none;border:2px solid var(--line);color:var(--navy)}
.err{color:var(--danger);font-size:14px;min-height:20px;margin:2px 6px 8px}
.tabs{display:flex;background:var(--soft);border-radius:27px;padding:4px;margin-bottom:22px}
.tabs button{flex:1;height:44px;border-radius:23px;color:var(--muted);font-weight:500}
.tabs button.on{background:var(--card);color:var(--navy);box-shadow:0 4px 14px rgba(40,60,120,.1)}
.or{text-align:center;color:var(--muted);font-size:13px;margin:16px 0 4px}
.link{color:var(--blue);font-weight:500;font-size:14px}
.pick{display:flex;justify-content:center;margin-bottom:22px}
.pick .av{cursor:pointer}
.pick .cam{position:absolute;right:0;bottom:0;width:34px;height:34px;border-radius:50%;background:var(--blue);display:grid;place-items:center;border:3px solid var(--card)}
.pick .cam svg{width:16px;height:16px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(20,28,60,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}
.sheet{background:var(--card);border-radius:36px;padding:30px;width:min(420px,100%);max-height:92vh;overflow:auto}
.sheet h2{font:600 24px var(--head);color:var(--navy);margin:0 0 6px}
.sheet p{color:var(--muted);margin:0 0 18px;line-height:1.5;font-size:14.5px}
.sheet ol{color:var(--ink);line-height:1.8;padding-left:20px;font-size:14.5px;margin:0 0 14px}
.qrimg{display:grid;place-items:center;margin:8px 0}
.qrimg img{width:240px;height:240px;border-radius:18px;border:1px solid var(--line);background:#fff}
.found{display:flex;gap:14px;align-items:center;background:var(--soft);border-radius:22px;padding:14px;margin:6px 0 14px}
.found .n{font:500 17px var(--head);color:var(--navy)}.found .u{color:var(--muted);font-size:13px}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:#22264a;color:#fff;padding:13px 22px;border-radius:24px;z-index:99;font-size:14.5px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:90vw}
#scan{position:fixed;inset:0;background:#000;z-index:80}
#scan video{width:100%;height:100%;object-fit:cover}
#scan .tt{position:absolute;top:0;left:0;right:0;padding:26px;color:#fff;font-weight:600;text-align:center;background:linear-gradient(#000a,transparent)}
#scan button{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:13px 30px;border-radius:30px;font-weight:600}
#viewer{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:80;display:grid;place-items:center;cursor:zoom-out}
#viewer img{max-width:94vw;max-height:92vh;border-radius:12px}

/* ---------- responsive ---------- */
@media (max-width:960px){
  .stage{padding:0;gap:0;display:block;height:100dvh;min-height:0}
  .phone{width:100%;height:100dvh;border-radius:0;box-shadow:none}
  body:not(.chat-open) #chatCard{display:none}
  body.chat-open #listCard{display:none}
  .panel-top{padding-top:max(46px,env(safe-area-inset-top))}
  .chead{padding-top:max(34px,env(safe-area-inset-top))}
  .nav{height:96px}
  .fab{bottom:114px;width:68px;height:68px}
}
@media (max-width:420px){
  .panel{padding:0 20px}.scroll{margin:0 -20px;padding:0 20px 90px}
  .panel-top h1{font-size:34px}
  .msgs{padding:20px 18px 8px}.composer{padding:6px 16px 22px}.chead{padding-left:18px;padding-right:18px}
  .typing{padding:0 18px}
  .bub{padding:14px 22px;font-size:16px}
  .solo{padding:48px 24px 28px}
}
</style>
</head>
<body>

<!-- AUTH -->
<div class="stage hidden" id="authStage">
  <div class="phone"><div class="solo">
    <div class="logo" id="logoI"></div>
    <h1 id="authTitle">Welcome back</h1>
    <p class="sub">Private messages, end-to-end encrypted. Sign in with your email.</p>
    <div class="tabs" id="authTabs"><button id="tabIn" class="on">Sign in</button><button id="tabUp">Create account</button></div>
    <div id="otpStep" class="hidden">
      <p class="sub" id="otpSub" style="margin-top:0"></p>
      <div class="field"><label>6-digit code</label><input id="otpCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••" style="text-align:center;letter-spacing:10px;font-size:22px"></div>
      <div class="err" id="otpErr"></div>
      <button class="btn" id="otpGo">Verify &amp; create account</button>
      <div style="display:flex;justify-content:space-between;margin-top:14px">
        <button class="link" id="otpBack">Change email</button>
        <button class="link" id="otpResend" disabled>Resend code</button>
      </div>
    </div>
    <div id="formStep">
    <div class="field"><label>Email</label><input id="aEmail" type="email" autocomplete="email" placeholder="you@example.com"></div>
    <div class="field"><label>Password</label><input id="aPass" type="password" autocomplete="current-password" placeholder="At least 6 characters"></div>
    <div class="field hidden" id="aPass2w"><label>Confirm password</label><input id="aPass2" type="password" autocomplete="new-password" placeholder="Repeat password"></div>
    <div class="err" id="aErr"></div>
    <button class="btn" id="aGo">Sign in</button>
    <div style="text-align:center;margin-top:14px"><button class="link" id="aForgot">Forgot password?</button></div>
    <div id="qrOpt"><div class="or">or</div><button class="btn line" id="qrBtn">Log in with QR code</button></div>
    </div>
  </div></div>
</div>

<!-- PROFILE SETUP -->
<div class="stage hidden" id="setupStage">
  <div class="phone"><div class="solo">
    <h1 id="suTitle">Set up your profile</h1>
    <p class="sub" id="suSub">Add a name and photo. You'll get a unique UID number that friends can use to find you.</p>
    <div class="pick"><div class="av" id="suAv" style="width:112px;height:112px"></div></div>
    <input type="file" id="suFile" accept="image/*" class="hidden">
    <div class="field"><label>Name</label><input id="suName" maxlength="40" placeholder="Your name"></div>
    <div class="field"><label>Phone number (optional, so friends can add you)</label><input id="suPhone" type="tel" placeholder="+91 98765 43210"></div>
    <div class="field"><label>About</label><textarea id="suAbout" maxlength="120" placeholder="Hey there! I'm using Messages."></textarea></div>
    <div class="err" id="suErr"></div>
    <button class="btn" id="suSave">Continue</button>
    <button class="btn ghost hidden" id="suCancel">Cancel</button>
  </div></div>
</div>

<!-- APP -->
<div class="stage hidden" id="appStage">
  <div class="phone" id="listCard">
    <div class="panel" id="tabChats">
      <div class="panel-top"><h1 id="ptTitle">Messages</h1><button class="icon-btn" id="searchBtn" aria-label="Search"></button></div>
      <div class="searchbar" id="sbar"><input id="sIn" placeholder="Search…"></div>
      <div class="scroll" id="listBody"></div>
    </div>
    <button class="fab" id="fab" aria-label="New chat"></button>
    <nav class="nav">
      <button data-tab="contacts" aria-label="Contacts"></button>
      <button data-tab="settings" aria-label="Settings"></button>
      <button data-tab="calls" aria-label="Calls"></button>
      <button data-tab="chats" class="on" aria-label="Chats"></button>
    </nav>
  </div>
  <div class="phone" id="chatCard"></div>
</div>

<div id="modalRoot"></div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>

function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for(const k in (attrs||{})){
    const v = attrs[k];
    if(k==='class') e.className = v;
    else if(k==='html') e.innerHTML = v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if(v!==false && v!=null) e.setAttribute(k, v);
  }
  kids.flat().forEach(c => { if(c==null||c===false) return; e.append(c.nodeType?c:document.createTextNode(c)); });
  return e;
}

function b64(buf){ const u=new Uint8Array(buf); let s=''; for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(s); }
function unb64(s){ const b=atob(s), u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }

function relTime(ts){
  if(!ts) return '';
  const d=(Date.now()-ts)/1000;
  if(d<60) return 'now';
  if(d<3600) return Math.floor(d/60)+' min';
  if(d<86400){ const x=Math.floor(d/3600); return x+(x===1?' hour':' hours'); }
  const x=Math.floor(d/86400); if(x<7) return x+(x===1?' day':' days');
  return new Date(ts).toLocaleDateString([], {day:'numeric',month:'short'});
}

/* =====================================================================
   E2EE  — per-device ECDH P-256 keys, per-message AES-GCM key,
   message key wrapped separately for every device of both users.
   Private keys are non-extractable and live only in this browser's IndexedDB.
   ===================================================================== */
const ECDH = {name:'ECDH', namedCurve:'P-256'};
function idb(){
  return new Promise((ok,no)=>{ const r=indexedDB.open('msgr-e2ee',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>ok(r.result); r.onerror=()=>no(r.error); });
}
async function idbGet(k){ const d=await idb(); return new Promise((ok,no)=>{ const r=d.transaction('kv').objectStore('kv').get(k); r.onsuccess=()=>ok(r.result); r.onerror=()=>no(r.error); }); }
async function idbSet(k,v){ const d=await idb(); return new Promise((ok,no)=>{ const t=d.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete=()=>ok(); t.onerror=()=>no(t.error); }); }

async function loadOrCreateDevice(uid){
  let d = await idbGet('dev:'+uid);
  if(!d){
    const kp = await crypto.subtle.generateKey(ECDH, false, ['deriveKey']);       // private key: non-extractable
    const pub = await crypto.subtle.exportKey('jwk', kp.publicKey);
    d = { id: hex(rand(6)), priv: kp.privateKey, pub: JSON.stringify(pub) };
    await idbSet('dev:'+uid, d);
  }
  return d;
}
async function importPub(jwkStr){ return crypto.subtle.importKey('jwk', JSON.parse(jwkStr), ECDH, false, []); }
async function wrapKeyFor(myPriv, theirPubStr){
  const pub = await importPub(theirPubStr);
  return crypto.subtle.deriveKey({name:'ECDH', public:pub}, myPriv, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
// bytes -> {iv, ct, keys:{deviceId:{i,c}}}
async function e2eeEncrypt(bytes, myPriv, targets /* {devId: pubJwkString} */, mediaBytes){
  const mk = await crypto.subtle.generateKey({name:'AES-GCM', length:256}, true, ['encrypt']);
  const iv = rand(12);
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, mk, bytes);
  const raw = await crypto.subtle.exportKey('raw', mk);
  const keys = {};
  for(const [id,pub] of Object.entries(targets)){
    try{
      const sk = await wrapKeyFor(myPriv, pub), wiv = rand(12);
      keys[id] = { i:b64(wiv), c:b64(await crypto.subtle.encrypt({name:'AES-GCM', iv:wiv}, sk, raw)) };
    }catch(e){ console.warn('skip device', id, e); }
  }
  let media = null;
  if(mediaBytes){ const miv = rand(12); media = { iv:b64(miv), ct:b64(await crypto.subtle.encrypt({name:'AES-GCM', iv:miv}, mk, mediaBytes)) }; }
  return { iv:b64(iv), ct:b64(ct), keys, media };
}
async function e2eeUnwrap(rec, myDevId, myPriv, senderPubStr){
  const w = rec.k && rec.k[myDevId]; if(!w) return null;
  const sk = await wrapKeyFor(myPriv, senderPubStr);
  const raw = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(w.i)}, sk, unb64(w.c));
  return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
}
async function e2eeDecryptBody(rec, mk){ return crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(rec.iv)}, mk, unb64(rec.ct)); }
async function e2eeDecryptMedia(m, mk){ return crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(m.iv)}, mk, unb64(m.ct)); }

/* ---------------- email OTP (first-time sign-up) ---------------- */
let otpBusy=false, otpEmail='', otpTimer=null;
async function otpApi(path,body){
  let r; try{ r=await fetch(OTP_WORKER+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); }
  catch(e){ throw new Error('Network error. Check your connection.'); }
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error||'Something went wrong. Try again.');
  return j;
}
function otpCooldown(sec){
  const b=$('#otpResend'); clearInterval(otpTimer); b.disabled=true;
  const tick=()=>{ if(sec<=0){ clearInterval(otpTimer); b.disabled=false; b.textContent='Resend code'; } else { b.textContent='Resend in '+sec+'s'; sec--; } };
  tick(); otpTimer=setInterval(tick,1000);
}
async function otpStart(email){
  await otpApi('/otp/send',{email});
  otpEmail=email;
  $('#formStep').classList.add('hidden'); $('#authTabs').classList.add('hidden');
  $('#otpStep').classList.remove('hidden');
  $('#authTitle').textContent='Check your email';
  $('#otpSub').textContent='We sent a 6-digit code to '+email+'. It expires in 10 minutes.';
  $('#otpCode').value=''; $('#otpErr').textContent=''; otpCooldown(60);
  setTimeout(()=>$('#otpCode').focus(),50);
}
function otpReset(){
  clearInterval(otpTimer);
  $('#otpStep').classList.add('hidden'); $('#formStep').classList.remove('hidden'); $('#authTabs').classList.remove('hidden');
  setMode(signUpMode);
}
$('#otpBack').onclick=otpReset;
$('#otpResend').onclick=async()=>{
  $('#otpErr').textContent='';
  try{ await otpApi('/otp/send',{email:otpEmail}); toast('New code sent'); otpCooldown(60); }
  catch(e){ $('#otpErr').textContent=e.message; }
};
$('#otpCode').addEventListener('input',e=>{ e.target.value=e.target.value.replace(/\D/g,'').slice(0,6); if(e.target.value.length===6) $('#otpGo').click(); });
$('#otpGo').onclick=async()=>{
  const code=$('#otpCode').value.trim(), err=$('#otpErr'); err.textContent='';
  if(!/^\d{6}$/.test(code)){ err.textContent='Enter the 6-digit code.'; return; }
  if(otpBusy) return; otpBusy=true; $('#otpGo').disabled=true;
  const pass=$('#aPass').value;
  try{
    const {token}=await otpApi('/otp/verify',{email:otpEmail,code});
    await auth.signInWithCustomToken(token);
    // attach email + password so every later login is just email/password
    try{ await auth.currentUser.linkWithCredential(firebase.auth.EmailAuthProvider.credential(otpEmail,pass)); }
    catch(e){
      if(e.code==='auth/email-already-in-use'||e.code==='auth/credential-already-in-use'){
        try{ await auth.currentUser.delete(); }catch(_){ await auth.signOut(); }
        otpBusy=false; otpReset(); setMode(false);
        $('#aErr').textContent='An account with this email already exists. Sign in instead.'; return;
      }
      throw e;
    }
    otpBusy=false; otpReset(); setMode(false); ['#aPass','#aPass2','#otpCode'].forEach(x=>$(x).value='');
    await onUser(auth.currentUser);   // continue into profile setup / app
  }catch(e){
    otpBusy=false;
    if(auth.currentUser && !(auth.currentUser.providerData||[]).length){ try{ await auth.signOut(); }catch(_){} }
    err.textContent=authErr(e);
  }
  $('#otpGo').disabled=false;
};

function resizeImage(fileOrBlob, max, q){
  return new Promise((ok,no)=>{
    const url=URL.createObjectURL(fileOrBlob), img=new Image();
    img.onload=()=>{ const s=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg',q)); };
    img.onerror=()=>{ URL.revokeObjectURL(url); no(new Error('Bad image')); }; img.src=url;
  });
}
async function allocateUidNum(){
  for(let i=0;i<8;i++){
    const r = await R('counters/uid').transaction(v => (v||10000000)+1);
    if(!r.committed) continue;
    const n = r.snapshot.val();
    const ix = await R('uidIndex/'+n).transaction(v => v===null ? me.uid : undefined);
    if(ix.committed) return n;
  }
  throw new Error('Could not allocate a UID number, try again');
}

    if(phoneRaw && phoneDigits(phoneRaw).length<7) throw new Error('Phone number looks too short.');
    let uidNum = myProf && myProf.uidNum;
    if(!uidNum) uidNum = await allocateUidNum();
    const upd = {};
    upd['users/'+me.uid] = { name, about:$('#suAbout').value.trim(), photo:suPhoto||null, uidNum, created:(myProf&&myProf.created)||TS };

    // phone index (hashed key); remove the old one if the number changed

    if(oldPhone && phoneDigits(oldPhone)!==phoneDigits(phoneRaw)) upd['phoneIndex/'+await phoneKey(oldPhone)] = null;
    if(phoneRaw) upd['phoneIndex/'+await phoneKey(phoneRaw)] = me.uid;
    upd['private/'+me.uid+'/phone'] = phoneRaw||null;
    await R('').update(upd);
    myProf = { uid:me.uid, name, about:$('#suAbout').value.trim(), photo:suPhoto||null, uidNum };
    if(suEdit){ show('appStage'); renderAll(); toast('Profile updated'); }
    else await startApp();
  }catch(e){ err.textContent=e.message||String(e); }

};

async function onUser(user){
  if(otpBusy && user) return;   // wait until the password is attached
  stopApp();
  me = user;
  if(!user){ myProf=null; show('authStage'); return; }
  try{
    dev = await loadOrCreateDevice(user.uid);
    const snap = await R('users/'+user.uid).once('value');
    if(!snap.exists()){ myProf=null; openSetup(false); return; }
    myProf = { uid:user.uid, ...snap.val() };
    await startApp();
  }catch(e){ console.error(e); toast('Error: '+(e.message||e)); show('authStage'); }
}

async function startApp(){
  // publish this device's public key (never the private key)
  await R(`devices/${me.uid}/${dev.id}`).set({ pub:dev.pub, label:deviceLabel(), ts:TS });
  show('appStage');
  // presence
  const pr = R('presence/'+me.uid);
  const conn = db.ref('.info/connected');
  const onc = conn.on('value', s => { if(s.val()){ pr.onDisconnect().set({online:false,last:TS}); pr.set({online:true,last:TS}); } });
  watchers.push(()=>{ conn.off('value',onc); pr.set({online:false,last:TS}).catch(()=>{}); });
  // my profile live
  const mp = R('users/'+me.uid); const mf = mp.on('value', s=>{ if(s.exists()){ myProf={uid:me.uid,...s.val()}; if(tab==='settings') renderList(); } });
  watchers.push(()=>mp.off('value',mf));
  // contacts
  const cr = R('contacts/'+me.uid);
  const cf = cr.on('value', s => syncContacts(Object.keys(s.val()||{})));
  watchers.push(()=>cr.off('value',cf));
  setTab('chats'); renderChat();
}
function stopApp(){
  Object.values(contactWatch).forEach(f=>f());
  watchers.forEach(f=>{ try{f();}catch(e){} }); watchers=[]; contacts={}; presence={}; threads={}; openUid=null; document.body.classList.remove('chat-open');
}
function deviceLabel(){
  const u=navigator.userAgent; let os='Device';
  if(/Android/i.test(u)) os='Android'; else if(/iPhone|iPad/i.test(u)) os='iOS'; else if(/Windows/i.test(u)) os='Windows'; else if(/Mac/i.test(u)) os='Mac'; else if(/Linux/i.test(u)) os='Linux';
  let br='Browser'; if(/Edg\//.test(u)) br='Edge'; else if(/OPR\//.test(u)) br='Opera'; else if(/Chrome\//.test(u)) br='Chrome'; else if(/Firefox\//.test(u)) br='Firefox'; else if(/Safari\//.test(u)) br='Safari';
  return br+' on '+os;
}

function syncContacts(uids){
  uids.forEach(uid => {
    if(contactWatch[uid]) return;
    const pr = R('users/'+uid), pf = pr.on('value', s=>{ if(s.exists()){ contacts[uid]={uid,...s.val()}; renderAll(); } });
    const pp = R('presence/'+uid), ppf = pp.on('value', s=>{ presence[uid]=s.val()||{}; renderAll(); });
    threads[uid] = threads[uid] || { items:[], last:null, unread:0, chain:Promise.resolve() };
    const mr = R('chats/'+cidOf(me.uid,uid)+'/messages').limitToLast(60);
    const mf = mr.on('child_added', s => { const t=threads[uid]; t.chain = t.chain.then(()=>onMsg(uid,s.key,s.val())).catch(e=>console.warn(e)); });
    contactWatch[uid] = () => { pr.off('value',pf); pp.off('value',ppf); mr.off('child_added',mf); delete contactWatch[uid]; };
  });
  Object.keys(contactWatch).forEach(u=>{ if(!uids.includes(u)){ contactWatch[u](); delete contacts[u]; delete threads[u]; if(openUid===u) closeChat(); } });
  renderAll();
}

/* ---------------- messages: receive ---------------- */
async function senderPub(uid, devId){
  const k = uid+'/'+devId; if(pubCache.has(k)) return pubCache.get(k);
  const s = await R(`devices/${uid}/${devId}/pub`).once('value'); const v=s.val(); if(v) pubCache.set(k,v); return v;
}
async function onMsg(uid, key, rec){
  const t = threads[uid]; if(!t || t.items.some(i=>i.key===key)) return;
  const item = { key, from:rec.from, ts:rec.ts||Date.now(), rec, p:null, mk:null, locked:false };
  try{
    const spub = await senderPub(rec.from, rec.fd);
    const mk = spub ? await e2eeUnwrap(rec, dev.id, dev.priv, spub) : null;
    if(!mk) item.locked = true;
    else { item.mk = mk; item.p = JSON.parse(dec.decode(await e2eeDecryptBody(rec, mk))); }
  }catch(e){ item.locked = true; }
  t.items.push(item); t.items.sort((a,b)=>a.ts-b.ts || (a.key<b.key?-1:1));
  t.last = t.items[t.items.length-1];
  const lr = getLR(uid);
  t.unread = t.items.filter(i=>i.from!==me.uid && i.ts>lr).length;
  if(openUid===uid){
    if(document.visibilityState==='visible'){ setLR(uid, Math.max(Date.now(), item.ts)); t.unread=0; }
    appendMsg(item);
  }
  renderList();
}
function previewOf(it){
  if(!it) return 'Say hello 👋';
  if(it.locked) return '🔒 Encrypted message';
  const p=it.p, who = it.from===me.uid ? 'You: ' : '';
  if(p.t==='img') return who+'📷 Photo';
  if(p.t==='voice') return who+'🎤 Voice message';
  return who+p.text;
}

/* ---------------- messages: send ---------------- */
async function targetDevices(uid){
  const out = {};
  for(const u of [uid, me.uid]){
    const s = await R('devices/'+u).once('value'); const v=s.val()||{};
    for(const [id,d] of Object.entries(v)){ out[id]=d.pub; pubCache.set(u+'/'+id,d.pub); }
  }
  return out;
}
async function sendPayload(uid, payload, mediaDataUrl){
  const targets = await targetDevices(uid);
  const e = await e2eeEncrypt(enc.encode(JSON.stringify(payload)), dev.priv, targets, mediaDataUrl ? enc.encode(mediaDataUrl) : null);
  const cid = cidOf(me.uid, uid), mref = R(`chats/${cid}/messages`).push(), key = mref.key;
  const rec = { from:me.uid, fd:dev.id, ts:TS, iv:e.iv, ct:e.ct, k:e.keys };
  const upd = {}; upd[`chats/${cid}/messages/${key}`] = rec;
  if(e.media){ rec.media = 1; upd[`chats/${cid}/media/${key}`] = e.media; }
  await R('').update(upd);
}
async function sendText(uid, text){ text=text.trim(); if(!text) return; await sendPayload(uid,{t:'text',text}); }

  if(mediaCache.has(it.key)) return mediaCache.get(it.key);
  const s=await R(`chats/${cidOf(me.uid,uid)}/media/${it.key}`).once('value'); const m=s.val(); if(!m) throw new Error('missing');
  const url=dec.decode(await e2eeDecryptMedia(m,it.mk)); mediaCache.set(it.key,url); return url;
}
let lastDayShown = '';
function appendMsg(it){
  const box=$('#msgs'); if(!box||!openUid) return; const uid=openUid;
  if(it.from!==me.uid&&it.from!==uid) return;
  if(box.querySelector(`[data-k="${it.key}"]`)) return;
  const near = box.scrollHeight-box.scrollTop-box.clientHeight<140 || it.from===me.uid;
  const mine=it.from===me.uid, p=it.p;
  const dayStr=new Date(it.ts).toDateString();
  const lastDay=[...box.querySelectorAll('[data-d]')].pop();
  if(!lastDay||lastDay.dataset.d!==dayStr){ const l=new Date(it.ts).toDateString()===new Date().toDateString()?'Today':new Date(it.ts).toLocaleDateString([], {weekday:'short',day:'numeric',month:'short'}); box.append(h('div',{class:'day','data-d':dayStr},l)); }
  const el=h('div',{class:'m '+(mine?'me':'them'),'data-k':it.key});
  let bub=h('div',{class:'bub'});
  if(it.locked){ el.classList.add('locked'); bub.append('🔒 This message was sent before this device was linked, so it can\'t be decrypted here.'); }
  else if(p.t==='text'){
    if(/^\p{Extended_Pictographic}(️)?$/u.test(p.text.trim())){ el.classList.add('sticker'); }
    bub.append(p.text);
  } else if(p.t==='img'){
    el.classList.add('img'); const im=h('img',{alt:'Photo',style:'min-width:160px;min-height:120px;background:rgba(127,127,127,.15)'}); bub.append(im);
    getMedia(uid,it).then(u=>{ im.src=u; im.style.minWidth=im.style.minHeight=''; im.onclick=()=>{ const v=h('div',{id:'viewer',onclick:()=>v.remove()},h('img',{src:u})); document.body.append(v); }; if(near) box.scrollTop=box.scrollHeight; }).catch(()=>{ bub.textContent='📷 Photo unavailable'; });
  } else if(p.t==='voice'){
    el.classList.add('voicem'); bub.append(voiceEl(uid,it,p));
  }
  el.append(bub, h('div',{class:'ts'},clock(it.ts)));
  box.append(el);
  if(near) box.scrollTop=box.scrollHeight;
}
let curAudio=null;
function stopAllAudio(){ if(curAudio){ curAudio.a.pause(); curAudio.reset(); curAudio=null; } }
function voiceEl(uid,it,p){
  const wave=h('div',{class:'wave'}); const bars=(p.wave&&p.wave.length?p.wave:Array.from({length:36},(_,i)=>.25+.6*Math.abs(Math.sin(i*.7)))).map(v=>h('i',{style:`height:${Math.max(6,Math.round(v*40))}px`})); wave.append(...bars);
  const dur=h('span',{class:'vdur'}, Math.floor(p.dur/60)+':'+String(p.dur%60).padStart(2,'0'));
  const btn=h('button',{class:'play','aria-label':'Play'},svg('play'));
  let a=null;
  const reset=()=>{ btn.innerHTML=''; btn.append(svg('play')); bars.forEach(b=>b.classList.remove('p')); dur.textContent=Math.floor(p.dur/60)+':'+String(p.dur%60).padStart(2,'0'); };
  btn.onclick=async()=>{
    if(curAudio&&curAudio.a===a){ if(a.paused){ a.play(); btn.innerHTML=''; btn.append(svg('pause')); } else { a.pause(); btn.innerHTML=''; btn.append(svg('play')); } return; }
    stopAllAudio();
    try{
      const url=await getMedia(uid,it); a=new Audio(url); curAudio={a,reset};
      a.ontimeupdate=()=>{ const d=isFinite(a.duration)&&a.duration>0?a.duration:p.dur, f=a.currentTime/d; bars.forEach((b,i)=>b.classList.toggle('p',i/bars.length<f)); const r=Math.max(0,Math.round(d-a.currentTime)); dur.textContent=Math.floor(r/60)+':'+String(r%60).padStart(2,'0'); };
      a.onended=()=>{ reset(); curAudio=null; };
      await a.play(); btn.innerHTML=''; btn.append(svg('pause'));
    }catch(e){ toast('Could not play voice message'); }
  };
  return h('div',{class:'voice'},wave,dur,btn);
}

/* =====================================================================
   QR login  (laptop shows QR, phone scans it from Settings → Link a device)
   ===================================================================== */
let kq=null;
function kqLoad(u){ return new Promise((ok,no)=>{ const e=document.createElement('script'); e.src=u; e.onload=ok; e.onerror=()=>no(new Error('load fail')); document.head.appendChild(e); }); }
function qrImg(text){ const q=qrcode(0,'M'); q.addData(text); q.make(); return q.createDataURL(8,4); }
function devName(){ return deviceLabel(); }
$('#qrBtn').onclick = async () => {
  const img=h('img',{alt:'QR'}), msg=h('div',{style:'text-align:center;font-size:13px;color:var(--muted);margin-top:10px'},'Generating QR code…');
  const m=modal(h('div',{class:'sheet'}, h('h2',{},'Log in with QR code'),
    h('ol',{},h('li',{},'Open Messages on your phone'),h('li',{},'Go to Settings → ',h('b',{},'Link a device')),h('li',{},'Scan this code')),
    h('div',{class:'qrimg'},img), msg, h('button',{class:'btn line',style:'margin-top:14px',onclick:()=>{ kq&&(kq.alive=false); closeModal(); }},'Cancel')));
  if(kq) kq.alive=false; const my=kq={alive:true};
  async function cycle(){
    msg.textContent='Generating QR code…';
    try{
      const r=await (await fetch(QR_WORKER+'/qr/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({label:devName()})})).json();
      if(!r.sid) throw new Error('QR service unavailable');
      img.src=qrImg(QR_PREFIX+r.sid); msg.textContent='Scan with your phone (valid for 2 minutes)';
      const end=Date.now()+115000;
      while(my.alive&&Date.now()<end){
        await new Promise(x=>setTimeout(x,2000)); if(!my.alive) return;
        const s=await (await fetch(QR_WORKER+'/qr/status?sid='+r.sid+'&poll='+r.poll)).json();
        if(s.status==='approved'){ msg.textContent='Logging in…'; await auth.signInWithCustomToken(s.token); my.alive=false; closeModal(); return; }
        if(s.status==='expired') break;
      }
      if(my.alive) cycle();
    }catch(e){ console.error(e); msg.textContent='Error: '+(e.message||e)+' — close and try again'; }
  }
  cycle();
};
let ksc=null;
async function jsqrEnsure(){
  if(typeof jsQR!=='undefined') return true;
  for(const u of ['https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js','https://cdnjs.cloudflare.com/ajax/libs/jsqr/1.4.0/jsQR.min.js','https://unpkg.com/jsqr@1.4.0/dist/jsQR.js']){ try{ await kqLoad(u); if(typeof jsQR!=='undefined') return true; }catch(e){} }
  return false;
}
async function scanOpen(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ toast('Camera needs https'); return; }
  let det=null; if('BarcodeDetector' in window){ try{ det=new BarcodeDetector({formats:['qr_code']}); }catch(e){} }
  if(!det && !(await jsqrEnsure())){ toast('Scanner failed to load'); return; }
  let stream; try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}); }catch(e){ toast('Camera error: '+(e.message||e)); return; }
  const v=h('video',{playsinline:true,muted:true}); v.srcObject=stream;
  const box=h('div',{id:'scan'},v,h('div',{class:'tt'},'Scan the QR code shown on your laptop'),h('button',{onclick:close},'Close')); document.body.append(box);
  await v.play(); ksc={on:true};
  function close(){ if(ksc) ksc.on=false; stream.getTracks().forEach(t=>t.stop()); box.remove(); }
  const c=document.createElement('canvas'), x=c.getContext('2d',{willReadFrequently:true});
  const found=t=>{ if(t&&t.startsWith(QR_PREFIX)){ close(); approveQr(t.slice(QR_PREFIX.length)); return true; } return false; };
  const tick=async()=>{ if(!ksc||!ksc.on) return;
    try{ if(v.videoWidth){
      if(det){ const r=await det.detect(v); if(r&&r[0]&&found(r[0].rawValue)) return; }
      else{ c.width=v.videoWidth; c.height=v.videoHeight; x.drawImage(v,0,0); const q=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height); if(q&&found(q.data)) return; }
    } }catch(e){}
    requestAnimationFrame(tick); };
  tick();
}
async function approveQr(sid){
  try{
    const info=await (await fetch(QR_WORKER+'/qr/info?sid='+encodeURIComponent(sid))).json();
    if(info.error){ toast('QR code expired. Generate a new one on your laptop'); return; }
    modal(h('div',{class:'sheet'}, h('h2',{},'Log in on '+info.label+'?'), h('p',{},'Only allow this if the device is yours. Old messages stay on the devices that already have them.'),
      h('button',{class:'btn',onclick:async()=>{
        try{ const tok=await auth.currentUser.getIdToken(true);
          const r=await fetch(QR_WORKER+'/qr/approve',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+tok},body:JSON.stringify({sid})});
          closeModal(); toast(r.ok?'Device linked':'Link failed'); }catch(e){ closeModal(); toast('Link failed'); } }},'Allow'),
      h('button',{class:'btn ghost',style:'margin-top:10px',onclick:closeModal},'Deny')));
  }catch(e){ toast('Link failed'); }
}

document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&openUid&&threads[openUid]){ threads[openUid].unread=0; setLR(openUid,Date.now()); renderList(); } });
if(!firebaseConfig.apiKey) document.body.textContent='Missing Firebase config';
