<style>
:root{
  --bg:#f0f0f0; --card:#fff; --ink:#111318; --mute:#9a9ca3; --mute2:#b4b6bc; --line:#dcdde2;
  --blue:#2f6df0; --blue-d:#2459d3; --btn:#f0f0f0; --btn-h:#e6e6e8; --tint:#f4f4f6;
  --ok:#17a35a; --bad:#d9433b; --warn:#c98a0a;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Manrope',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding:clamp(12px,3vw,40px);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.shell{max-width:1240px;margin:0 auto;background:var(--card);border-radius:28px;position:relative;overflow:hidden;min-height:calc(100vh - clamp(24px,6vw,80px));padding:0 clamp(18px,4vw,56px) 56px;box-shadow:0 1px 0 #fff inset}
.shell:before{content:"";position:absolute;right:-180px;top:80px;width:620px;height:620px;border-radius:50%;background:radial-gradient(circle,rgba(120,175,255,.28),rgba(120,175,255,0) 68%);pointer-events:none}
.shell:after{content:"";position:absolute;left:-200px;bottom:-220px;width:700px;height:560px;border-radius:50%;background:radial-gradient(circle,rgba(255,236,160,.35),rgba(255,236,160,0) 68%);pointer-events:none}
.shell>*{position:relative;z-index:1}

/* top bar */
header{display:flex;align-items:center;gap:20px;height:88px;border-bottom:1px solid var(--line)}
.burger{width:36px;height:36px;display:grid;place-items:center;border-radius:8px;color:#666}
.burger:hover{background:var(--tint)}
.brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:500;color:#555;letter-spacing:-.01em;white-space:nowrap}
.brand img{height:30px;width:auto;display:block}
.brand span{font-weight:400;color:#777}
.hsearch{flex:1;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:0 6px}
.hsearch svg{flex:none;color:#8a8d95}
.hsearch input{flex:1;border:0;outline:0;background:transparent;font-size:15px;min-width:0}
.hsearch input::placeholder{color:var(--mute2)}
.hright{display:flex;align-items:center;gap:18px;margin-left:auto}
.cartbtn{position:relative;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#8a8d95}
.cartbtn:hover{background:var(--tint)}
.cartbtn b{position:absolute;top:0;right:-2px;min-width:18px;height:18px;border-radius:9px;background:var(--blue);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}
.user{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600}
.avatar{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#5b8cff,#1a2fb8 70%);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}

/* side menu */
.scrim{position:fixed;inset:0;background:rgba(20,22,30,.32);opacity:0;pointer-events:none;transition:.25s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.menu{position:fixed;left:0;top:0;bottom:0;width:290px;background:#fff;z-index:50;transform:translateX(-102%);transition:transform .3s cubic-bezier(.2,.8,.2,1);padding:24px 16px;display:flex;flex-direction:column;gap:4px;border-radius:0 24px 24px 0;box-shadow:0 20px 60px rgba(0,0,0,.18)}
.menu.on{transform:none}
.menu .brand{padding:4px 12px 22px}
.menu a{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:12px;font-size:14.5px;font-weight:500;color:#444;text-decoration:none;cursor:pointer}
.menu a:hover{background:var(--tint)}
.menu a.cur{background:#eaf0ff;color:var(--blue)}
.menu small{margin-top:auto;color:var(--mute);font-size:12px;padding:12px}

/* hero */
.hello{padding:72px 0 0}
.hello h1{font-weight:400;font-size:clamp(26px,3.2vw,40px);line-height:1.18;letter-spacing:-.02em}
.hello h1 span{color:#a2a4aa}
.sub{margin-top:56px;color:var(--blue);font-size:14px}

/* steps */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-top:56px}
.step{padding:34px 30px 30px;display:flex;flex-direction:column;border-radius:4px;transition:background .25s}
.step.hot,.step:hover{background:rgba(238,238,242,.7)}
.ico{width:58px;height:58px;border-radius:12px;position:relative;display:grid;place-items:center;color:#fff;
  background:radial-gradient(circle at 12% 16%,#ff4259 0,transparent 58%),radial-gradient(circle at 92% 8%,#2f7bff 0,transparent 58%),radial-gradient(circle at 90% 96%,#24c964 0,transparent 55%),radial-gradient(circle at 8% 94%,#ffc21a 0,transparent 55%),#f6a623}
.ico svg{filter:drop-shadow(0 1px 1px rgba(0,0,0,.15))}
.ico.dns{background:none;display:grid;place-items:stretch;grid-template-rows:1fr 1fr;gap:3px;height:48px;width:50px}
.ico.dns i{border-radius:6px;display:block;position:relative}
.ico.dns i:first-child{background:linear-gradient(120deg,#ff3b55,#3d7dff)}
.ico.dns i:last-child{background:linear-gradient(120deg,#ffc21a,#24c964)}
.ico.dns i:after{content:"";position:absolute;left:8px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:#fff}
.tr{display:flex;align-items:center;gap:10px}
.tr>svg{color:#c3c5ca}
.step h3{font-size:15.5px;font-weight:500;margin-top:30px;color:#2c2e34}
.step hr{border:0;border-top:1px solid #d9dadf;width:50px;margin:14px 0}
.step p{font-size:12.5px;line-height:1.55;color:var(--mute);min-height:40px}
.step .b{margin-top:44px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:5px;font-size:13px;font-weight:600;background:var(--btn);color:#303238;transition:.15s;white-space:nowrap}
.btn:hover{background:var(--btn-h)}
.btn.p{background:var(--blue);color:#fff}.btn.p:hover{background:var(--blue-d)}
.btn.w{width:100%}
.btn.s{height:36px;padding:0 14px;font-size:12.5px}
.btn.d{color:var(--bad)}
.btn[disabled]{opacity:.45;pointer-events:none}

/* blocks */
.sec{margin-top:64px}
.sec h2{font-weight:500;font-size:20px;letter-spacing:-.01em}
.sec .lead{color:var(--mute);font-size:13px;margin-top:6px}
.tlds{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:22px}
.tld{border:1px solid var(--line);border-radius:12px;padding:16px 16px;background:rgba(255,255,255,.7);text-align:left;transition:.15s}
.tld:hover{border-color:var(--blue);transform:translateY(-2px)}
.tld b{font-size:22px;font-weight:600;letter-spacing:-.02em}
.tld small{display:block;color:var(--mute);font-size:12px;margin-top:4px}
.tld .was{text-decoration:line-through;margin-right:6px}

.pagehead{padding:56px 0 0}
.pagehead h1{font-weight:400;font-size:clamp(24px,2.8vw,34px);letter-spacing:-.02em}
.pagehead p{color:var(--mute);margin-top:8px;font-size:14px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--blue);font-size:13px;font-weight:600;margin-bottom:18px;cursor:pointer}

/* search page */
.sbox{display:flex;gap:10px;margin-top:28px;border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff;box-shadow:0 8px 30px rgba(60,90,160,.07)}
.sbox input{flex:1;border:0;outline:0;padding:0 14px;font-size:17px;min-width:0;background:transparent}
.layout{display:grid;grid-template-columns:260px 1fr;gap:32px;margin-top:30px;align-items:start}
.filters{border:1px solid var(--line);border-radius:14px;padding:20px;background:rgba(255,255,255,.8);position:sticky;top:16px}
.filters h4{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600;margin:20px 0 10px}
.filters h4:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 11px;border-radius:99px;background:var(--btn);font-size:12.5px;font-weight:500;color:#444;transition:.12s}
.chip:hover{background:var(--btn-h)}
.chip.on{background:var(--blue);color:#fff}
.radio{display:flex;flex-direction:column;gap:2px}
.radio label{display:flex;gap:10px;align-items:center;font-size:13.5px;padding:6px 0;cursor:pointer}
input[type=radio],input[type=checkbox]{accent-color:var(--blue);width:16px;height:16px}
input[type=range]{width:100%;accent-color:var(--blue)}
.rv{display:flex;justify-content:space-between;font-size:12.5px;color:#666;margin-top:4px}
.sel{width:100%;height:40px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:#fff;font-size:13.5px}
.results{display:flex;flex-direction:column;gap:10px}
.rhead{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute);margin-bottom:4px}
.row{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:20px;border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:rgba(255,255,255,.85);transition:.15s}
.row:hover{border-color:#c4cbe0;box-shadow:0 6px 22px rgba(60,90,160,.07)}
.row.main{border-color:var(--blue);background:#f6f9ff}
.dn{font-size:18px;font-weight:600;letter-spacing:-.01em;word-break:break-all}
.dn em{font-style:normal;color:var(--blue)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;margin-left:8px;vertical-align:middle;letter-spacing:.02em}
.tag.ok{background:#e4f6ec;color:var(--ok)}.tag.no{background:#fbe8e6;color:var(--bad)}.tag.pr{background:#fff3d6;color:var(--warn)}.tag.own{background:#e8eefe;color:var(--blue)}
.meta{font-size:12px;color:var(--mute);margin-top:4px}
.price{text-align:right}.price b{font-size:18px;font-weight:600}.price small{display:block;font-size:11.5px;color:var(--mute);margin-top:2px}
.empty{padding:50px 20px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:14px}
.h3s{font-size:13px;font-weight:600;color:#555;margin:18px 0 4px}

/* tables / forms */
.panel{border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.85);padding:22px;margin-top:22px}
.panel h3{font-size:15px;font-weight:600;margin-bottom:4px}
.panel .lead{color:var(--mute);font-size:13px;margin-bottom:16px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12px;font-weight:600;color:#666}
.inp{height:44px;border:1px solid var(--line);border-radius:8px;padding:0 12px;font-size:14px;background:#fff;outline:0;width:100%}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,109,240,.12)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:110px 1fr 1fr 90px auto;gap:10px;align-items:end}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:12px 10px;border-bottom:1px solid #eeeff2;word-break:break-all}
td.a{text-align:right;white-space:nowrap}
.sw{position:relative;width:42px;height:24px;flex:none}
.sw input{opacity:0;position:absolute;inset:0;width:100%;height:100%;cursor:pointer;z-index:2}
.sw i{position:absolute;inset:0;border-radius:99px;background:#cfd1d7;transition:.2s}
.sw i:after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw input:checked+i{background:var(--blue)}.sw input:checked+i:after{left:21px}
.set{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:16px 0;border-bottom:1px solid #eeeff2}
.set:last-child{border:0}
.set b{font-size:14px;font-weight:600;display:block}.set small{color:var(--mute);font-size:12.5px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:28px;overflow-x:auto}
.tabs button{padding:12px 16px;font-size:13.5px;font-weight:600;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--blue);border-color:var(--blue)}
.prov{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.prov button{border:1px solid var(--line);border-radius:12px;padding:20px;text-align:left;background:#fff;transition:.15s}
.prov button:hover{border-color:var(--blue);transform:translateY(-2px)}
.prov button.on{border-color:var(--blue);background:#f2f6ff}
.prov b{display:block;font-size:15px}.prov small{color:var(--mute);font-size:12px}
.dcard{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:18px;background:rgba(255,255,255,.85);margin-top:12px}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:600;background:#e4f6ec;color:var(--ok);margin-right:6px}
.pill.y{background:#fff3d6;color:var(--warn)}
.prog{display:flex;gap:6px;margin:6px 0 4px}
.prog i{flex:1;height:5px;border-radius:3px;background:#e1e3e8}.prog i.on{background:var(--blue)}
.code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:#f3f4f7;border-radius:6px;padding:2px 6px}

/* cart drawer + modal */
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(420px,100%);background:#fff;z-index:60;transform:translateX(104%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.14)}
.drawer.on{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:22px 24px;border-bottom:1px solid var(--line)}
.dh h3{font-weight:600;font-size:17px}
.db{flex:1;overflow:auto;padding:8px 24px}
.ci{padding:16px 0;border-bottom:1px solid #eeeff2;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.ci b{font-size:15px;word-break:break-all}
.ci select{height:34px;border:1px solid var(--line);border-radius:6px;padding:0 8px;font-size:12.5px;background:#fff}
.df{padding:20px 24px;border-top:1px solid var(--line)}
.tot{display:flex;justify-content:space-between;font-size:16px;font-weight:600;margin-bottom:14px}
.modal{position:fixed;inset:0;z-index:70;display:none;place-items:center;padding:16px}
.modal.on{display:grid}
.modal .box{background:#fff;border-radius:18px;padding:28px;width:min(480px,100%);max-height:92vh;overflow:auto;position:relative;z-index:2;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.modal .bg{position:absolute;inset:0;background:rgba(20,22,30,.4)}
.modal h3{font-size:19px;font-weight:600;margin-bottom:6px}
.note{font-size:12px;color:var(--mute);margin-top:12px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);background:#16181d;color:#fff;padding:12px 20px;border-radius:10px;font-size:13.5px;opacity:0;pointer-events:none;transition:.3s;z-index:90}
.toast.on{opacity:1;transform:translate(-50%,0)}
footer{margin-top:80px;padding-top:22px;border-top:1px solid var(--line);color:var(--mute);font-size:12.5px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

@media(max-width:1020px){.steps{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.filters{position:static}.g3{grid-template-columns:1fr 1fr}}
@media(max-width:640px){
  header{height:72px;gap:10px}.hsearch{display:none}.user span{display:none}.hello{padding-top:44px}
  .steps{grid-template-columns:1fr;gap:12px;margin-top:36px}.sub{margin-top:30px}
  .row{grid-template-columns:1fr auto}.row .price{grid-column:1;text-align:left}.row .btn{grid-row:1/3;grid-column:2}
  .g2{grid-template-columns:1fr}.sbox{flex-direction:column}.sbox .btn{width:100%}.shell{border-radius:20px}
  .brand{font-size:16px}.brand img{height:24px}
}
</style>
</head>

function clean(s){return s.toLowerCase().trim().replace(/^https?:\/\//,'').replace(/^www\./,'').replace(/\/.*$/,'')}
function split(q){q=clean(q);const keys=Object.keys(TLDS).sort((a,b)=>b.length-a.length);for(const t of keys){if(q.endsWith('.'+t))return[q.slice(0,-t.length-1),t]}const i=q.indexOf('.');return i>0?[q.slice(0,i),null]:[q,null]}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2400)}
const greet=()=>{const h=new Date().getHours();return h<12?'Good Morning':h<17?'Good Afternoon':'Good Evening'};
const initials=n=>n.split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase()||'U';
const inCart=d=>S.cart.some(x=>x.d===d);
const expiry=y=>{const d=new Date();d.setFullYear(d.getFullYear()+y);return d.toISOString().slice(0,10)};
const validDom=d=>/^([a-z0-9]([a-z0-9-]*[a-z0-9])?\.)+[a-z]{2,}$/.test(d);

function filtersHTML(){
 return `<h4>Category</h4><div class="chips">${CATS.map(c=>`<button class="chip ${Q.cat===c?'on':''}" data-cat="${c}">${c}</button>`).join('')}</div>
 <h4>Extensions</h4><div class="chips">${Object.keys(TLDS).filter(t=>Q.cat==='All'||TLDS[t][2]===Q.cat).map(t=>`<button class="chip ${Q.tlds.includes(t)?'on':''}" data-t="${t}">.${t}</button>`).join('')}</div>

 <div style="margin-top:20px"><button class="btn w s" id="freset">Reset filters</button></div>`;

function rowHTML(d,main){
 const st=status(d),p=price(d),[n,t]=[d.slice(0,d.indexOf('.')),d.slice(d.indexOf('.'))];
 const tag={ok:'<span class="tag ok">Available</span>',taken:'<span class="tag no">Taken</span>',premium:'<span class="tag pr">Premium</span>',own:'<span class="tag own">Owned</span>'}[st];
 const act=st==='taken'?`<button class="btn s" disabled>Unavailable</button>`:st==='own'?`<button class="btn s" data-manage="${d}">Manage</button>`:inCart(d)?`<button class="btn s" data-act="cart">In cart ✓</button>`:`<button class="btn p s" data-add="${d}">Add to cart</button>`;
 return `<div class="row ${main?'main':''}"><div><div class="dn">${esc(n)}<em>${esc(t)}</em>${tag}</div><div class="meta">${main?'Best match · ':''}${TLDS[t.slice(1)][2]} extension · ${n.length} characters</div></div><div class="price">${st==='taken'?'<small>—</small>':`<b>${money(p.first)}</b><small>then ${money(p.renew)}/yr</small>`}</div>${act}</div>`;
}
function runSearch(){
 const out=$('#results');if(!out)return;
 $('#filters').innerHTML=filtersHTML();
 if(!Q.q.trim()){out.innerHTML=`<div class="empty">Type a name above to see available domains.</div>`;return}
 let [name,exact]=split(Q.q);name=name.replace(/[^a-z0-9-]/g,'').replace(/^-+|-+$/g,'');
 if(!name){out.innerHTML=`<div class="empty">Please use letters, numbers or hyphens.</div>`;return}
 let list=Object.keys(TLDS).filter(t=>(Q.cat==='All'||TLDS[t][2]===Q.cat)&&(!Q.tlds.length||Q.tlds.includes(t))||t===exact&&!Q.tlds.length&&Q.cat==='All').map(t=>name+'.'+t);
 const pass=d=>{const st=status(d),p=price(d).first;
  if(Q.avail==='ok'&&st!=='ok'&&st!=='premium')return false;if(Q.avail==='taken'&&st!=='taken')return false;
  if(Q.max<8000&&p>Q.max&&st!=='taken')return false;if(name.length>Q.len)return false;if(Q.nohy&&/[-0-9]/.test(name))return false;return true};
 list=list.filter(pass);
 const ex=exact?name+'.'+exact:null;
 if(Q.sort==='pa')list.sort((a,b)=>price(a).first-price(b).first);else if(Q.sort==='pd')list.sort((a,b)=>price(b).first-price(a).first);else if(Q.sort==='az')list.sort();
 else list.sort((a,b)=>(status(a)==='taken')-(status(b)==='taken')||price(a).first-price(b).first);
 if(ex){list=list.filter(d=>d!==ex);list.unshift(ex)}
 let sug=[];if(!Q.tlds.length||true){const base=[...SUFFIX.map(p=>p+name),...POST.map(s=>name+s)];['com','in','ai','io','app'].forEach(t=>base.forEach(b=>{const d=b+'.'+t;if(status(d)==='ok'&&pass(d))sug.push(d)}))}
 sug=sug.sort((a,b)=>hash(a)-hash(b)).slice(0,6);
 const avail=list.filter(d=>['ok','premium'].includes(status(d))).length;
 out.innerHTML=`<div class="rhead"><span><b style="color:var(--ink)">${list.length}</b> results · ${avail} available</span><span>for “${esc(name)}”</span></div>`+
  (list.length?list.map(d=>rowHTML(d,d===ex)).join(''):`<div class="empty">No domains match these filters. Try resetting them.</div>`)+
  (sug.length?`<div class="h3s">Smart suggestions</div>`+sug.map(d=>rowHTML(d)).join(''):'');
}

/* ---------- router ---------- */
let route='/';
function nav(p){location.hash='#'+p}
function render(){
 route=(location.hash||'#/').slice(1)||'/';
 const app=$('#app');let h;
 const m=route.match(/^\/domain\/(.+)$/);
 if(m)h=vManage(decodeURIComponent(m[1]));
 else h={'/':vHome,'/search':vSearch,'/domains':vDomains,'/transfer':vTransfer,'/connect':vConnect,'/dns':vDns,'/settings':vSettings}[route]?.()||vHome();
 app.innerHTML=h;
 $$('.menu a').forEach(a=>a.classList.toggle('cur',a.dataset.go===route));
 $('#un').textContent=S.name;$('#av').textContent=initials(S.name);
 if(route==='/search')runSearch();
 closeAll();window.scrollTo({top:0});cartUI();
}
function openManage(d){vManage.tab='overview';nav('/domain/'+encodeURIComponent(d))}
window.addEventListener('hashchange',render);

/* ---------- cart ---------- */
function lineTotal(i){const p=price(i.d);return p.first+(i.y-1)*p.renew}
function cartUI(){
 const n=S.cart.length,cc=$('#cc');cc.hidden=!n;cc.textContent=n;
 $('#cartbody').innerHTML=n?S.cart.map((i,k)=>`<div class="ci"><b>${esc(i.d)}</b><button class="btn s d" data-rm="${k}" style="height:30px">Remove</button><select data-yr="${k}">${[1,2,3,5,10].map(y=>`<option value="${y}" ${i.y===y?'selected':''}>${y} year${y>1?'s':''}</option>`).join('')}</select><b style="text-align:right;font-size:14px">${money(lineTotal(i))}</b></div>`).join(''):`<div class="empty" style="margin-top:24px">Your cart is empty.</div>`;
 const tot=S.cart.reduce((a,i)=>a+lineTotal(i),0);
 $('#cartfoot').innerHTML=n?`<div class="tot"><span>Total</span><span>${money(tot)}</span></div><button class="btn p w" data-act="checkout">Checkout</button><p class="note">Free WHOIS privacy included with every domain.</p>`:`<button class="btn w" data-go="/search" data-act="close">Search for domains</button>`;
}
function addCart(d){if(inCart(d))return;S.cart.push({d,y:1});save();cartUI();toast(d+' added to cart');if(route==='/search')runSearch()}
function checkout(){
 const tot=S.cart.reduce((a,i)=>a+lineTotal(i),0);
 $('#mbox').innerHTML=`<h3>Checkout</h3><p class="lead" style="color:var(--mute);font-size:13px;margin-bottom:18px">${S.cart.length} domain${S.cart.length>1?'s':''} · ${money(tot)}</p>
 <form id="cof"><div class="field"><label>Full name</label><input class="inp" name="n" value="${esc(S.name)}" required></div><div class="field"><label>Email</label><input class="inp" type="email" name="e" placeholder="you@example.com" required></div><div class="field"><label>Payment method</label><select class="inp"><option>UPI</option><option>Card</option><option>Net banking</option></select></div>
 <button class="btn p w" style="margin-top:6px">Pay ${money(tot)}</button></form>`;
 $('#drawer').classList.remove('on');$('#modal').classList.add('on');
}
function finishOrder(){throw new Error('demo checkout disabled');
 S.cart.forEach(i=>{S.domains.push({d:i.d,exp:expiry(i.y),auto:S.autoRenew,privacy:S.privacy,lock:true,site:null,dns:[['A','@','192.0.2.1',3600],['CNAME','www','@',3600]]})});
 const n=S.cart.length;S.cart=[];save();
 $('#mbox').innerHTML=`<div style="text-align:center;padding:10px 0"><div class="ico" style="margin:0 auto 18px;width:64px;height:64px"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg></div><h3>Order complete</h3><p class="lead" style="color:var(--mute);font-size:13.5px;margin:6px 0 22px">${n} domain${n>1?'s are':' is'} now in your account.</p><button class="btn p w" data-go="/domains" data-act="close">Go to my domains</button></div>`;
 cartUI();
}

/* ---------- overlays ---------- */
function closeAll(){['menu','drawer','scrim'].forEach(i=>$('#'+i).classList.remove('on'));$('#modal').classList.remove('on')}
function connect(d,pn){return;
 const x=S.domains.find(v=>v.d===d),p=PROV.find(v=>v[0]===pn);if(!x||!p)return;
 x.dns=x.dns.filter(r=>!(['A','CNAME'].includes(r[0])&&['@','www'].includes(r[1])));
 p[2].forEach(r=>x.dns.push([r[0],r[1],r[2]||'203.0.113.10',3600]));x.site=pn;save();
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-go],[data-act],[data-add],[data-tld],[data-cat],[data-t],[data-manage],[data-tab],[data-opt],[data-del],[data-prov],[data-cprov],[data-rm],[data-cancel],[data-extend]');if(!t)return;
 const D=t.dataset;
 if(D.add)return addCart(D.add);
 if(D.tld){Q.q=Q.q||'';$('#hq').value='';nav('/search');if(!Q.q)Q.q='';Q.tlds=[D.tld];setTimeout(()=>{$('#sq')?.focus()},50);return}
 if(D.cat){Q.cat=D.cat;Q.tlds=[];return runSearch()}
 if(D.t){Q.tlds=Q.tlds.includes(D.t)?Q.tlds.filter(x=>x!==D.t):[...Q.tlds,D.t];return runSearch()}
 if(D.manage)return openManage(D.manage);
 if(D.tab){vManage.tab=D.tab;return render()}
 if(D.rm){S.cart.splice(+D.rm,1);save();cartUI();if(route==='/search')runSearch();return}
 if(D.del!==undefined){const d=decodeURIComponent(route.split('/')[2]),x=S.domains.find(v=>v.d===d);x.dns.splice(+D.del,1);save();return render()}
 if(D.prov){const d=decodeURIComponent(route.split('/')[2]);connect(d,D.prov);toast('Connected to '+D.prov+' — DNS updated');return render()}
 if(D.cprov){const d=$('#cdom').value;connect(d,D.cprov);toast(d+' connected to '+D.cprov);return openManage(d)}
 if(D.cancel){S.transfers=S.transfers.filter(x=>x.d!==D.cancel);save();return render()}
 if(D.extend){const d=decodeURIComponent(route.split('/')[2]),x=S.domains.find(v=>v.d===d);x.exp=(+x.exp.slice(0,4)+1)+x.exp.slice(4);save();toast('Extended by 1 year');return render()}
 if(D.go){nav(D.go);if(D.act!=='close')return}
 const a=D.act;
 if(a==='menu'){$('#menu').classList.add('on');$('#scrim').classList.add('on')}
 else if(a==='cart'){$('#drawer').classList.add('on');$('#scrim').classList.add('on')}
 else if(a==='close')closeAll();
 else if(a==='checkout')checkout();
});
document.addEventListener('submit',e=>{
 const f=e.target;
 if(f.id==='hform'){e.preventDefault();Q.q=$('#hq').value;Q.tlds=[];nav('/search');if(route==='/search'){render()}return}
 if(f.id==='sform'){e.preventDefault();Q.q=$('#sq').value;return runSearch()}
 if(f.id==='dnsf'){e.preventDefault();const d=decodeURIComponent(route.split('/')[2]),x=S.domains.find(v=>v.d===d),v=new FormData(f);x.dns.push([v.get('t'),v.get('n'),v.get('v'),+v.get('l')||3600]);save();toast('Record added');vManage.tab='dns';return render()}
 if(f.id==='trf'){e.preventDefault();const v=new FormData(f),d=clean(v.get('d'));if(!validDom(d)){toast('Enter a valid domain');return}
  if(S.transfers.some(t=>t.d===d)||S.domains.some(t=>t.d===d)){toast('Already in your account');return}
  S.transfers.push({d,step:0});save();toast('Transfer started for '+d);nav('/domains');
  const tt=S.transfers.find(t=>t.d===d);setTimeout(()=>{if(tt)tt.step=1;save()},4000);return}
 if(f.id==='cof'){e.preventDefault();finishOrder()}
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.id==='fmax'){Q.max=+t.value;runSearchKeep(t)} else if(t.id==='flen'){Q.len=+t.value;runSearchKeep(t)}
});
function runSearchKeep(t){const id=t.id;runSearch();const n=$('#'+id);n.focus()}
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.name==='av'){Q.avail=t.value;runSearch()}
 else if(t.id==='fhy'){Q.nohy=t.checked;runSearch()}
 else if(t.id==='fsort'){Q.sort=t.value;runSearch()}
 else if(t.dataset.yr!==undefined){S.cart[+t.dataset.yr].y=+t.value;save();cartUI()}
 else if(t.dataset.opt){const d=decodeURIComponent(route.split('/')[2]),x=S.domains.find(v=>v.d===d);x[{auto:'auto',privacy:'privacy',lock:'lock'}[t.dataset.opt]]=t.checked;save();toast('Saved')}
 else if(t.id==='sname'){S.name=t.value.trim()||'Guest';save();render()}
 else if(t.id==='scur'){S.cur=t.value;save();toast('Currency set to '+t.value)}
 else if(t.id==='sauto'){S.autoRenew=t.checked;save()}
 else if(t.id==='spriv'){S.privacy=t.checked;save()}
 else if(t.id==='snote'){S.emailNote=t.checked;save()}
});
document.addEventListener('click',e=>{
 if(e.target.id==='freset'){Q={...Q,tlds:[],cat:'All',avail:'all',max:8000,len:63,sort:'rel',nohy:false};runSearch()}
 if(e.target.id==='sreset'){if(confirm('Reset all data on this device?')){S=Object.assign({},def,{cart:[],domains:[],transfers:[]});save();render()}}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAll()});
document.addEventListener('click',e=>{const m=e.target.closest('.menu a[data-go]');if(m)closeAll()});

render();
</script>

<script>
/* ---------- production layer: live Name.com search, Cashfree payments, real DNS ---------- */
(()=>{
/* >>> Firebase web config: Firebase console > Project settings > Your apps (same project as Kashish AI) <<< */
const FIREBASE_CONFIG={apiKey:"AIzaSyC30TcmMVhP_8HdFYS1WufRiZwSDYNMTF0",authDomain:"pulse2-92372.firebaseapp.com",projectId:"pulse2-92372",appId:"1:276235725177:web:0f4e0789fae80a435927a8"};
let ME=null,AFTER=null,FB=null;
if(window.firebase&&!FIREBASE_CONFIG.apiKey.startsWith('PASTE')){firebase.initializeApp(FIREBASE_CONFIG);FB=firebase.auth()}
const api=async(p,m='GET',b)=>{const tk=FB&&FB.currentUser?await FB.currentUser.getIdToken():'';const r=await fetch('https://kashish-domains-worker.sgursharn076.workers.dev/api'+p,{method:m,headers:{'content-type':'application/json','x-kd-user':tk},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok){if(r.status===401&&p!=='/me'&&p.indexOf('/auth/')<0){ME=null;openLogin()}throw new Error(j.error||'Something went wrong')}return j};
const R={};let CFG={transfer:{}},LAST={},seq=0,PENDING=[],CONTACT={};
try{CONTACT=JSON.parse(localStorage.kd_contact||'{}')}catch(e){}
window.__KD=1;S.domains=[];S.transfers=[];S.cart=S.cart.filter(i=>i.first>0);save();
api('/config').then(j=>CFG=j).catch(()=>{});
const tp=d=>CFG.transfer[d.slice(d.indexOf('.')+1)]??CFG.transfer.default??0;
money=n=>'₹'+Math.round(n).toLocaleString('en-IN');
status=d=>S.domains.some(x=>x.d===d)?'own':(R[d]?R[d].st:'taken');
price=d=>R[d]||{first:0,renew:0};
lineTotal=i=>i.type==='renew'||i.type==='transfer'?i.first:i.first+(i.y-1)*i.renew;
addCart=d=>{if(inCart(d)||!R[d])return;S.cart.push({d,y:1,first:R[d].first,renew:R[d].renew});save();cartUI();toast(d+' added to cart');if(route==='/search')runSearch()};

runSearch=async()=>{
 const out=$('#results');if(!out)return;
 $('#filters').innerHTML=filtersHTML();
 if(!Q.q.trim()){out.innerHTML='<div class="empty">Type a name above to see available domains.</div>';return}
 let [name,exact]=split(Q.q);name=name.replace(/[^a-z0-9-]/g,'').replace(/^-+|-+$/g,'');
 if(!name){out.innerHTML='<div class="empty">Please use letters, numbers or hyphens.</div>';return}
 const tl=Object.keys(TLDS).filter(t=>(Q.cat==='All'||TLDS[t][2]===Q.cat)&&(!Q.tlds.length||Q.tlds.includes(t))||t===exact);
 const key=name+'|'+tl.join();
 if(LAST.key!==key){
  const my=++seq;out.innerHTML='<div class="empty">Checking live availability…</div>';
  const base=[...SUFFIX.map(p=>p+name),...POST.map(x=>name+x)],sn=['com','in','ai'].flatMap(t=>base.map(b=>b+'.'+t));
  try{
   const [a,b]=await Promise.all([api('/search','POST',{names:tl.map(t=>name+'.'+t)}),api('/search','POST',{names:sn}).catch(()=>({results:[]}))]);
   if(my!==seq)return;
   [...a.results,...b.results].forEach(r=>R[r.d]={st:r.st,first:r.first,renew:r.renew});
   LAST={key,list:a.results.map(r=>r.d),sug:b.results.filter(r=>r.st==='ok').map(r=>r.d)};
  }catch(e){if(my===seq)out.innerHTML='<div class="empty">'+esc(e.message)+'</div>';return}
 }
 const pass=d=>{const st=status(d),p=price(d).first;
  if(Q.avail==='ok'&&st!=='ok'&&st!=='premium')return false;if(Q.avail==='taken'&&st!=='taken')return false;
  if(Q.max<8000&&p>Q.max&&st!=='taken')return false;if(name.length>Q.len)return false;if(Q.nohy&&/[-0-9]/.test(name))return false;return true};
 let list=LAST.list.filter(pass);const ex=exact?name+'.'+exact:null;
 if(Q.sort==='pa')list.sort((a,b)=>price(a).first-price(b).first);else if(Q.sort==='pd')list.sort((a,b)=>price(b).first-price(a).first);else if(Q.sort==='az')list.sort();
 else list.sort((a,b)=>(status(a)==='taken')-(status(b)==='taken')||price(a).first-price(b).first);
 if(ex&&list.includes(ex)){list=list.filter(d=>d!==ex);list.unshift(ex)}
 const sug=LAST.sug.filter(pass).slice(0,6),avail=list.filter(d=>['ok','premium'].includes(status(d))).length;
 out.innerHTML=`<div class="rhead"><span><b style="color:var(--ink)">${list.length}</b> results · ${avail} available</span><span>for “${esc(name)}”</span></div>`+
  (list.length?list.map(d=>rowHTML(d,d===ex)).join(''):'<div class="empty">No domains match these filters. Try resetting them.</div>')+
  (sug.length?'<div class="h3s">Smart suggestions</div>'+sug.map(d=>rowHTML(d)).join(''):'');
};

/* ----- account data ----- */
async function refresh(){const j=await api('/domains');S.domains=j.domains.map(n=>({dns:(S.domains.find(o=>o.d===n.d)||{}).dns||[],...n}));S.transfers=j.transfers;save()}
const R0=render;window.removeEventListener('hashchange',R0);
render=function(){R0();userUI();if(!ME&&/^\/(domains|dns|connect|transfer|settings|domain\/.+)$/.test(route)){openLogin();return}
 if(/^\/(domains|dns|connect|domain\/.+)$/.test(route)){const my=route,m=route.match(/^\/domain\/(.+)$/);
  refresh().then(async()=>{if(m)try{const d=decodeURIComponent(m[1]),j=await api('/domain/'+d),x=S.domains.find(v=>v.d===d);if(x)Object.assign(x,j)}catch(e){toast(e.message)}
   if(route===my)R0()}).catch(e=>toast(e.message))}};
window.addEventListener('hashchange',render);

/* ----- checkout (Cashfree) ----- */
checkout=(items=S.cart)=>{
 PENDING=items;if(!ME)return openLogin(()=>checkout(items));const C={first:(ME.name||'').split(' ')[0],last:(ME.name||'').split(' ').slice(1).join(' '),email:ME.email,...CONTACT},tot=items.reduce((a,i)=>a+lineTotal(i),0),f=(n,l,ph='',t='text')=>`<div class="field"><label>${l}</label><input class="inp" name="${n}" type="${t}" value="${esc(C[n]||'')}" placeholder="${ph}" required></div>`;
 $('#mbox').innerHTML=`<h3>Checkout</h3><p class="lead" style="color:var(--mute);font-size:13px;margin-bottom:18px">${items.length} item${items.length>1?'s':''} · ${money(tot)}</p>
 <form id="cof"><div class="g2">${f('first','First name')}${f('last','Last name')}</div>${f('email','Email','you@example.com','email')}
 <div class="g2">${f('cc','Dial code','91')}${f('phone','Phone','9876543210','tel')}</div>${f('address1','Address')}
 <div class="g2">${f('city','City')}${f('state','State')}</div><div class="g2">${f('zip','PIN / ZIP')}${f('country','Country (2 letters)','IN')}</div>
 <button class="btn p w" style="margin-top:6px">Pay ${money(tot)}</button></form>
 <p class="note">Contact details are required by ICANN for domain registration. Payment is processed securely by Cashfree (UPI, cards, netbanking).</p>`;
 $('#drawer').classList.remove('on');$('#modal').classList.add('on');
};
const modal=h=>{$('#mbox').innerHTML=h;$('#modal').classList.add('on')};
async function afterPay(id){
 modal('<div style="text-align:center;padding:20px 0"><h3>Confirming your payment…</h3><p class="note">Please don’t close this page.</p></div>');
 let j={status:'PENDING',items:[]};
 for(let k=0;k<8;k++){try{j=await api('/order/'+id)}catch(e){j={status:'ERR',items:[],msg:e.message}}if(!['PENDING','FULFILLING'].includes(j.status))break;await new Promise(r=>setTimeout(r,2500))}
 const T={FULFILLED:'Order complete',PARTIAL:'Partly completed',FAILED:'Payment not completed',PENDING:'Payment not completed',ERR:'Something went wrong'}[j.status]||'Order status';
 const L={reg:'Registered',renew:'Renewed',transfer:'Transfer started'};
 const rows=j.items.map(i=>`<div class="set"><div><b>${esc(i.d)}</b><small>${i.ok?L[i.type]:esc(i.error||'Failed')+(i.refunded?' — refund initiated':' — we will refund this shortly')}</small></div><span class="pill ${i.ok?'':'y'}">${i.ok?'Done':'Failed'}</span></div>`).join('');
 const ok=j.items.filter(i=>i.ok).map(i=>i.d);S.cart=S.cart.filter(c=>!ok.includes(c.d));save();cartUI();
 modal(`<h3>${T}</h3>${rows||`<p class="note">${esc(j.msg||'We did not receive a successful payment. If money was debited it will be refunded automatically.')}</p>`}<div style="margin-top:18px"><button class="btn p w" data-go="/domains" data-act="close">Go to my domains</button></div>`);
 refresh().catch(()=>{});
}

/* ----- intercept actions that must hit the real API ----- */
const cur=()=>decodeURIComponent(route.split('/')[2]||'');
const stop=e=>{e.stopImmediatePropagation()};
window.addEventListener('click',async e=>{
 const t=e.target.closest('[data-del],[data-prov],[data-cprov],[data-extend],[data-cancel]');if(!t)return;stop(e);
 const D=t.dataset;
 try{
  if(D.del!==undefined){const x=S.domains.find(v=>v.d===cur());await api('/domain/'+x.d+'/records/'+x.dns[+D.del][4],'DELETE');toast('Record deleted')}
  else if(D.prov||D.cprov){
   const d=D.prov?cur():$('#cdom').value,pn=D.prov||D.cprov,p=PROV.find(v=>v[0]===pn);
   const recs=p[2].map(r=>[r[0],r[1],r[2]||(prompt('Enter your server IP address')||'').trim()]).filter(r=>r[2]);
   if(!recs.length)return;
   await api('/domain/'+d+'/connect','POST',{site:pn,records:recs});toast(d+' connected to '+pn+' — DNS updated');await refresh();if(D.cprov)return openManage(d)}
  else if(D.extend){const x=S.domains.find(v=>v.d===cur());return checkout([{type:'renew',d:x.d,y:1,first:x.renewInr||0}])}
  else if(D.cancel){await api('/transfer/'+D.cancel+'/cancel','POST');toast('Transfer cancelled')}
  await refresh().catch(()=>{});render();
 }catch(x){toast(x.message)}
},true);
window.addEventListener('change',async e=>{
 const t=e.target;if(!t.dataset||!t.dataset.opt)return;stop(e);
 try{await api('/domain/'+cur()+'/settings','POST',{[t.dataset.opt]:t.checked});toast('Saved')}catch(x){toast(x.message);t.checked=!t.checked}
},true);
window.addEventListener('submit',async e=>{
 const f=e.target;if(!['dnsf','trf','cof','authf'].includes(f.id))return;e.preventDefault();stop(e);
 const v=Object.fromEntries(new FormData(f)),btn=f.querySelector('button');
 try{
  if(f.id==='authf'){await doAuth(v,f)}
  else if(f.id==='dnsf'){await api('/domain/'+cur()+'/records','POST',{type:v.t,name:v.n,value:v.v,ttl:+v.l||3600});toast('Record added');vManage.tab='dns';await refresh().catch(()=>{});render()}
  else if(f.id==='trf'){const d=clean(v.d);if(!validDom(d)){toast('Enter a valid domain');return}
   if(S.domains.some(x=>x.d===d)||S.transfers.some(x=>x.d===d)){toast('Already in your account');return}
   checkout([{type:'transfer',d,y:1,code:v.c,first:tp(d)}])}
  else{CONTACT=v;try{localStorage.kd_contact=JSON.stringify(v)}catch(_){}
   btn.disabled=true;btn.textContent='Please wait…';
   const j=await api('/checkout','POST',{items:PENDING.map(i=>({type:i.type||'reg',d:i.d,y:i.y||1,code:i.code})),contact:v,prefs:{auto:S.autoRenew,privacy:S.privacy}});
   await Cashfree({mode:j.env}).checkout({paymentSessionId:j.payment_session_id,redirectTarget:'_self'})}
 }catch(x){if(btn){btn.disabled=false;btn.textContent='Try again'}toast(x.message)}
},true);
/* ----- login ----- */
function banner(bg,fg,t){const d=document.createElement('div');d.style.cssText='background:'+bg+';color:'+fg+';padding:10px 16px;font-size:13px;font-weight:600;text-align:center;margin:0 -56px';d.textContent=t;$('#shell').insertBefore(d,$('#shell').firstChild)}
function userUI(){$('#un').textContent=ME?ME.name:'Sign in';$('#av').textContent=ME?initials(ME.name):'→';$('.user').style.cursor='pointer'}
function openLogin(after,mode='in'){AFTER=after||null;const su=mode==='up';
 modal(`<h3>${su?'Create your account':'Sign in'}</h3><p class="lead" style="color:var(--mute);font-size:13px;margin-bottom:18px">${su?'One account to buy and manage all your domains.':'Sign in to buy and manage your domains.'}</p>
 <button class="btn w" data-google style="margin-bottom:14px">Continue with Google</button><form id="authf" data-mode="${mode}">${su?'<div class="field"><label>Full name</label><input class="inp" name="name" required></div>':''}<div class="field"><label>Email</label><input class="inp" type="email" name="email" required></div><div class="field"><label>Password</label><input class="inp" type="password" name="password" minlength="8" required></div><button class="btn p w">${su?'Create account':'Sign in'}</button></form>
 <p class="note"><a class="back" data-switch="${su?'in':'up'}" style="margin:0">${su?'Already have an account? Sign in':'New here? Create an account'}</a></p>`)}
const fbErr=e=>({'auth/invalid-credential':'Wrong email or password','auth/wrong-password':'Wrong email or password','auth/user-not-found':'No account with this email','auth/email-already-in-use':'Account already exists. Please sign in.','auth/weak-password':'Password must be 6+ characters','auth/popup-closed-by-user':'Sign-in cancelled','auth/unauthorized-domain':'Add kashishai.com to Firebase > Authentication > Authorized domains'}[e.code]||e.message);
function done(){closeAll();userUI();const a=AFTER;AFTER=null;render();if(a)setTimeout(a,300)}
async function doAuth(v,f){if(!FB)throw new Error('Firebase config missing in index.html');
 try{if(f.dataset.mode==='up'){const c=await FB.createUserWithEmailAndPassword(v.email,v.password);await c.user.updateProfile({displayName:v.name});setMe(FB.currentUser)}
  else await FB.signInWithEmailAndPassword(v.email,v.password)}catch(e){throw new Error(fbErr(e))}
 toast('Welcome, '+ME.name.split(' ')[0]);done()}
async function google(){if(!FB)return toast('Firebase config missing in index.html');
 try{await FB.signInWithPopup(new firebase.auth.GoogleAuthProvider());toast('Welcome, '+ME.name.split(' ')[0]);done()}catch(e){toast(fbErr(e))}}
function setMe(u){ME=u?{name:u.displayName||(u.email||'User').split('@')[0],email:u.email||''}:null;S.name=ME?ME.name:'Guest'}
document.addEventListener('click',e=>{if(e.target.closest('[data-google]'))return google();const s=e.target.closest('[data-switch]');if(s)openLogin(AFTER,s.dataset.switch)});
window.addEventListener('click',async e=>{if(!e.target.closest('.user'))return;if(!ME)return openLogin();
 if(confirm('Sign out of '+ME.email+'?')){await FB.signOut();setMe(null);S.domains=[];S.transfers=[];save();nav('/');userUI();render()}});
(async()=>{
 try{const c=await api('/config');CFG=c;if(!c.transfer)throw 0;
  if(c.env!=='production'){banner('#fff3d6','#8a5a00','TEST MODE — payments and registrations are sandbox. Set CF_ENV=production on the worker to go live.')}}
 catch(e){banner('#fbe8e6','#b3261e','Backend not connected. Deploy the latest worker.js on kashish-domains-worker and set SITE_ORIGIN=https://kashishai.com.')}
 if(FB){await new Promise(res=>FB.onAuthStateChanged(u=>{const first=!FB._ready;FB._ready=1;setMe(u);if(first)res();else{userUI();if(!u){S.domains=[];S.transfers=[]}}}))}else banner('#fbe8e6','#b3261e','Firebase login not configured: paste your Firebase config at the top of the script in index.html.')
 S.name=ME?ME.name:'Guest';userUI();render();
 const id=new URLSearchParams(location.search).get('order_id');
 if(id&&/^KD[A-Z0-9]+$/.test(id)){history.replaceState(null,'',location.pathname+location.hash);if(ME)afterPay(id);else openLogin(()=>afterPay(id))}})();
})();
</script>
